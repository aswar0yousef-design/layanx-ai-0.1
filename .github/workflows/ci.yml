name: LayanX CI

on:
  push:
    branches: [main, "wip/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Windows starts as informational. Remove this line once the Windows run is green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Real branch instead of detached HEAD, so git-aware code does not need CI-only fallbacks.
      - name: Check out the branch by name
        run: git checkout -B "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # npm ci once package-lock.json is committed (reproducible); npm install until then.
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run security:check
      # Same as main today. PR #155 failed when a real test key was supplied; fix those tests before changing this.
      - run: LAYANX_SECRET_VAULT_KEY= npm run free:check
      - name: Run operational acceptance
        run: npm run operational:acceptance
      - name: Start health runtime
        if: runner.os == 'Linux'
        run: |
          PORT=18080 npm start > /tmp/layanx-health.log 2>&1 &
          echo $! > /tmp/layanx-health.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/health > /tmp/layanx-health-response.json; then
              cat /tmp/layanx-health-response.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/layanx-health.log
          exit 1
      - name: Stop health runtime
        if: always() && runner.os == 'Linux'
        run: |
          if [ -f /tmp/layanx-health.pid ]; then kill "$(cat /tmp/layanx-health.pid)" || true; fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build image (catches files missing from the Dockerfile)
        run: docker build -t layanx:ci .
  zap:
    # Real OWASP ZAP baseline (pinned image) against a deliberately careless local app.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: docker pull ghcr.io/zaproxy/zaproxy:2.17.0
      - run: node node_modules/tsx/dist/cli.mjs scripts/zap-smoke.ts
        env:
          LAYANX_ZAP: "on"
  evals:
    # The planner against a real (small) Ollama model: structured outputs, Arabic and prompt-injection cases.
    # The score of a 0.5B model is informative only; the job fails on harness or Ollama errors.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Install Ollama and a small model
        run: |
          # The official Docker image (Docker Hub is steadier on the runners than the 1.5 GB download from
          # ollama.com, which failed several runs); install.sh only if the image cannot be pulled.
          started=""
          for attempt in 1 2 3; do docker run -d --name ollama -p 127.0.0.1:11434:11434 ollama/ollama:latest && started=docker && break; docker rm -f ollama >/dev/null 2>&1; sleep 15; done
          if [ -z "$started" ]; then
            for attempt in 1 2 3; do curl -fsSL https://ollama.com/install.sh | sh && started=script && break; sleep 20; done
          fi
          [ -n "$started" ] || { echo "::error::Ollama could not be installed (Docker image and install.sh both failed)"; exit 1; }
          for i in {1..60}; do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          ol(){ if [ "$started" = docker ]; then docker exec ollama ollama "$@"; else ollama "$@"; fi; }
          for attempt in 1 2 3 4; do ol pull qwen2.5:0.5b && break; echo "pull attempt $attempt failed"; sleep 20; done
          ol list | grep -q qwen2.5:0.5b || { echo "::error::Ollama is running ($started) but qwen2.5:0.5b could not be pulled"; exit 1; }
      - run: npm run eval -- --model qwen2.5:0.5b --json eval-report.json
  windows:
    # Real Windows: typecheck, the full test suite, then the Windows-only smoke test
    # (compiled desktop helper with UI Automation, DPAPI secrets, npm without .cmd).
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: PowerShell scripts parse (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem scripts\windows\*.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            foreach ($e in @($errors)) { if ($e) { $bad++; Write-Host "::error file=scripts/windows/$($_.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)" } }
          }
          if ($bad) { exit 1 } else { Write-Host 'All PowerShell scripts parse.' }
      - run: npm run typecheck
      - name: Test suite
        run: npm test
        env:
          LAYANX_TEST_TIMEOUT_MS: "240000"
      - name: Install pinned security scanners (SHA-256 verified)
        if: always()
        run: node node_modules/tsx/dist/cli.mjs scripts/install-security-tools.ts
      - name: Install local voice (Piper, pinned), voice sense (Silero VAD + Smart Turn, pinned) and speech recognition (Whisper, pinned build)
        if: always()
        shell: powershell
        run: |
          .\scripts\windows\install-piper.ps1 -Yes -NoEnglish
          .\scripts\windows\install-voice-sense.ps1 -Yes
          .\scripts\windows\install-whisper.ps1 -Cpu -Model base
      # One step per group: GitHub shows at most 10 notices per step, and each check reports one.
      - name: Windows smoke test (desktop, host, ACP, secrets, npm)
        shell: powershell
        run: .\scripts\windows\smoke-test.ps1 -Only core
      - name: Uninstall and autostart scripts (temporary folders)
        if: always()
        shell: powershell
        run: .\scripts\windows\uninstall-test.ps1
      - name: Windows smoke test (restricted isolation)
        if: always()
        shell: powershell
        run: .\scripts\windows\smoke-test.ps1 -Only sandbox
      - name: Windows smoke test (security scanners)
        if: always()
        shell: powershell
        run: .\scripts\windows\smoke-test.ps1 -Only tools -WithTools
      - name: Windows smoke test (voice)
        if: always()
        shell: powershell
        run: .\scripts\windows\smoke-test.ps1 -Only voice -WithVoice
